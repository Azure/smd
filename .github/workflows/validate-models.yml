name: Validate Thing Models

on:
  pull_request:
    paths:
      - ".github/workflows/validate-models.yml"
      - "models/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-models.js"
      - "validation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-models.yml"
      - "models/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-models.js"
      - "validation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Thing Models
        run: npm test
