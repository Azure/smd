name: Validate Thing Models

on:
  pull_request:
    paths:
      - ".github/workflows/validate-models.yml"
      - "models/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-models.js"
      - "validation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-models.yml"
      - "models/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-models.js"
      - "validation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Thing Models
        run: npm test
